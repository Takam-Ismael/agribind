<div class="login-container">
  <div class="background-overlay"></div>
  <div class="glass-card">
    <div class="logo-section">
      <i class="fas fa-leaf"></i>
      <h1>AgriBind Cooperative</h1>
      <p>Welcome back to your agricultural dashboard</p>
    </div>

    <!-- ✅ Show error message if exists -->
    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- ✅ FIXED: Email/Username Input -->
      <div class="input-group">
        <label for="username" class="input-label">Email or Phone</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            id="username"
            type="text"
            formControlName="username"
            class="glass-input"
            placeholder=" "
            [class.error-input]="username?.invalid && username?.touched"
          />
        </div>
        <div *ngIf="username?.invalid && username?.touched" class="error">
          <span *ngIf="username?.errors?.['required']">Email or phone is required</span>
        </div>
      </div>

      <!-- ✅ Password Input with Toggle -->
      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="glass-input password-input"
            placeholder=" "
            [class.error-input]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div *ngIf="password?.invalid && password?.touched" class="error">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <!-- ✅ Submit Button -->
      <button
        type="submit"
        class="glass-button"
        [disabled]="isLoading || loginForm.invalid"
      >
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="spinner">
          <svg class="spinner-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="3" stroke-dasharray="32" stroke-dashoffset="32">
              <animate attributeName="stroke-dashoffset" values="32;0" dur="1s" repeatCount="indefinite"/>
            </circle>
          </svg>
          Logging in...
        </span>
      </button>
    </form>

    <!-- ✅ Footer Links -->
    <div class="footer-links">
      <a (click)="onForgotPassword()" style="cursor: pointer;">Forgot Password?</a>
      <span class="separator">|</span>
      <a (click)="onQRLogin()" style="cursor: pointer;">QR Login</a>
    </div>
  </div>
</div>
