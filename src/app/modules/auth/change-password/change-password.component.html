<div class="change-password-container">
  <!-- Background overlay with blur effect -->
  <div class="background-overlay"></div>

  <!-- Glassmorphism card -->
  <div class="glass-card">
    <!-- Logo and title section -->
    <div class="logo-section">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"
              stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.3"/>
        <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Secure Your Account</h1>
      <p>Update your password for the AgriBind Cooperative dashboard</p>
    </div>

    <!-- Change Password form -->
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="change-password-form">

      <!-- Current Password input -->
      <div class="input-group">
        <label class="input-label">Current Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="currentPassword"
            type="password"
            class="glass-input"
            formControlName="currentPassword"
            placeholder=" "
            [class.error-input]="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched"
          />
        </div>
        <div *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched" class="error">
          <span *ngIf="changePasswordForm.get('currentPassword')?.errors?.['required']">Current password is required</span>
        </div>
      </div>

      <!-- New Password input -->
      <div class="input-group">
        <label class="input-label">New Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15.5 7.5L19 4m0 0l-3.5-3.5M19 4H9a6 6 0 0 0 0 12h2.5"/>
            <path d="M12 21v-2m0-12V5"/>
          </svg>
          <input
            id="newPassword"
            type="password"
            class="glass-input"
            formControlName="newPassword"
            placeholder=" "
            [class.error-input]="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched"
          />
        </div>
        <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched" class="error">
          <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">New password is required</span>
          <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters</span>
        </div>
      </div>

      <!-- Confirm Password input -->
      <div class="input-group">
        <label class="input-label">Confirm New Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <input
            id="confirmPassword"
            type="password"
            class="glass-input"
            formControlName="confirmPassword"
            placeholder=" "
            [class.error-input]="(changePasswordForm.hasError('mismatch') && changePasswordForm.get('confirmPassword')?.touched) ||
                                (changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched)"
          />
        </div>
        <div *ngIf="changePasswordForm.get('confirmPassword')?.touched" class="error">
          <span *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
          <span *ngIf="changePasswordForm.hasError('mismatch') && !changePasswordForm.get('confirmPassword')?.errors?.['required']">
            Passwords do not match
          </span>
        </div>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="glass-button"
        [disabled]="isLoading || changePasswordForm.invalid"
      >
        <span *ngIf="!isLoading">Change Password</span>
        <span *ngIf="isLoading" class="spinner">
          <svg class="spinner-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="3" stroke-dasharray="32" stroke-dashoffset="32">
              <animate attributeName="stroke-dashoffset" values="32;0" dur="1s" repeatCount="indefinite"/>
            </circle>
          </svg>
          Updating Password...
        </span>
      </button>

      <!-- Footer links -->
      <div class="footer-links">
        <a (click)="goToLogin()" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
